[package]
name = "irpush"
version = "0.1.8"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
chacha20poly1305 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["sink", "alloc"] }
getrandom = "0.3"
jni = { version = "0.21", optional = true }
hex = "0.4"
hkdf = "0.12"
data-encoding = "2"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "pem"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum"] }
iroh-base = "1.4.1"
iroh-dns = "1.4.1"
# aws-lc-rs: the only rustls provider with X25519MLKEM768, so the relay hop is post-quantum too.
iroh-relay = { version = "1.4.1", default-features = false, features = ["tls-aws-lc-rs"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-std", "io-util", "fs"] }
x-wing = { version = "0.1.1", features = ["getrandom", "zeroize"] }
zeroize = "1"
# serve: a host's own relay (self-signed, pinned), behind a mapped port.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"], optional = true }
portmapper = { version = "0.20", default-features = false, optional = true }

[lib]
crate-type = ["lib", "staticlib"] # staticlib: iOS xcframework

[features]
# A host's own relay (desktops): `irpush DIR run --serve PORT`.
serve = ["iroh-relay/server", "dep:rcgen", "dep:portmapper"]
# ... pinging members after 130 min: needs iroh-relay with
# deploy/iroh-relay-ping-interval.patch (`make desktop`).
relay-ping = ["serve"]
ffi = []
jni = ["dep:jni"] # for android/: enable in the app's own native library

[profile.release]
lto = true
strip = true

[dev-dependencies]
p256 = { version = "0.14", default-features = false, features = ["alloc"] } # test: PKCS#8 encoding
iroh-relay = { version = "1.4.1", default-features = false, features = ["server", "tls-aws-lc-rs"] }
