name: CI
# Third-party actions pinned to commit SHAs; read-only token.
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: stable, components: clippy }
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets --features ffi,jni -- -D warnings
      - run: cargo install cargo-audit --locked && cargo audit

  ios: # the xcframework and the Swift package compile (no device run)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: stable, targets: "aarch64-apple-ios,aarch64-apple-ios-sim" }
      - run: make ios
      - run: xcodebuild build -scheme Irpush -destination 'generic/platform=iOS'

  android: # the library (Kotlin + libirpush.so) builds (no device run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "17" }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: stable, targets: "aarch64-linux-android,x86_64-linux-android" }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with: { packages: platform-tools }
      - run: |
          sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - run: ./gradlew --no-daemon :irpush:assembleRelease
        working-directory: android
